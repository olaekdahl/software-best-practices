openapi: "3.0.3"
info:
  title: Order Service API
  version: "2.2.0"
  description: |
    API for managing the order lifecycle - creation, submission,
    payment processing, and fulfillment tracking.
  contact:
    name: Platform Team
    email: platform@acme.com

servers:
  - url: http://localhost:8000
    description: Local development
  - url: https://api.staging.acme.com
    description: Staging environment
  - url: https://api.acme.com
    description: Production

paths:
  /v1/orders:
    get:
      summary: List orders
      operationId: listOrders
      tags:
        - Orders
      parameters:
        - name: cursor
          in: query
          description: Pagination cursor from previous response
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum number of orders to return
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: status
          in: query
          description: Filter by order status
          schema:
            type: string
            enum:
              - DRAFT
              - SUBMITTED
              - CONFIRMED
              - SHIPPED
              - DELIVERED
              - CANCELLED
      responses:
        "200":
          description: Paginated list of orders
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Order"
                  next_cursor:
                    type: string
                    nullable: true
                  has_more:
                    type: boolean
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      summary: Create order
      operationId: createOrder
      tags:
        - Orders
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Unique key to prevent duplicate order creation
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "201":
          description: Order created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Duplicate idempotency key

  /v1/orders/{orderId}:
    get:
      summary: Get order by ID
      operationId: getOrder
      tags:
        - Orders
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: Order details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/orders/{orderId}/submit:
    post:
      summary: Submit order for payment
      operationId: submitOrder
      tags:
        - Orders
      description: |
        Submits a DRAFT order for payment processing. The order must have
        at least one item. On successful payment, the order transitions
        to CONFIRMED status.
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: Order submitted and payment processed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Order is not in DRAFT status
        "402":
          description: Payment failed

  /v1/orders/{orderId}/cancel:
    post:
      summary: Cancel an order
      operationId: cancelOrder
      tags:
        - Orders
      description: |
        Cancels an order. Allowed within 1 hour of confirmation.
        If payment has been captured, a refund is initiated.
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: Order cancelled successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Order cannot be cancelled (past cancellation window or invalid status)

  /health:
    get:
      summary: Health check
      operationId: healthCheck
      tags:
        - System
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [healthy, degraded, unhealthy]
                  checks:
                    type: object
                    properties:
                      database:
                        type: string
                      redis:
                        type: string
                      rabbitmq:
                        type: string

components:
  parameters:
    OrderId:
      name: orderId
      in: path
      required: true
      description: Unique order identifier
      schema:
        type: string
        format: uuid

  schemas:
    CreateOrderRequest:
      type: object
      required:
        - customer_id
        - items
      properties:
        customer_id:
          type: string
          description: Customer placing the order
        items:
          type: array
          minItems: 1
          items:
            type: object
            required:
              - sku
              - quantity
            properties:
              sku:
                type: string
                description: Product SKU
              quantity:
                type: integer
                minimum: 1
                description: Number of units

    Order:
      type: object
      properties:
        id:
          type: string
          format: uuid
        customer_id:
          type: string
        status:
          type: string
          enum:
            - DRAFT
            - SUBMITTED
            - CONFIRMED
            - SHIPPED
            - DELIVERED
            - CANCELLED
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        total:
          type: number
          format: float
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    OrderItem:
      type: object
      properties:
        sku:
          type: string
        name:
          type: string
        quantity:
          type: integer
        unit_price:
          type: number
          format: float
        line_total:
          type: number
          format: float

    ProblemDetail:
      type: object
      description: RFC 7807 Problem Detail
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    Unauthorized:
      description: Missing or invalid authentication
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - BearerAuth: []

tags:
  - name: Orders
    description: Order lifecycle management
  - name: System
    description: Health and metrics endpoints
